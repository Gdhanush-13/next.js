name: 'sccache with Turbo Cache'
description: 'Start sccache with a WebDAV→Turbo proxy for per-crate Rust compilation caching. Call with mode=start before builds and mode=stop after.'
inputs:
  mode:
    description: '"start" to launch proxy + sccache, "stop" to print stats and shut down'
    required: true
  turbo-api:
    description: 'Override TURBO_API for sccache proxy (use when workflow overrides TURBO_TOKEN with a Vercel token but runner bashrc has a self-hosted TURBO_API)'
    required: false
    default: ''
  base-dir:
    description: 'SCCACHE_BASE_DIR for path normalization (default: $GITHUB_WORKSPACE)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install sccache
      if: ${{ inputs.mode == 'start' }}
      uses: taiki-e/install-action@v2
      with:
        tool: sccache@0.14.0

    - name: Configure sccache env + start proxy
      if: ${{ inputs.mode == 'start' }}
      shell: bash
      run: |
        # Override TURBO_API if the caller specified one (needed when the workflow
        # overrides TURBO_TOKEN with a Vercel token but the runner's bashrc points
        # TURBO_API at a self-hosted server that doesn't accept Vercel tokens).
        if [ -n "${{ inputs.turbo-api }}" ]; then
          export TURBO_API="${{ inputs.turbo-api }}"
        fi

        # Verify turbo API connectivity (must succeed or the build fails)
        node scripts/memcache-turbo-proxy.js --test

        # Start proxy in background
        node scripts/memcache-turbo-proxy.js &
        echo $! > ${RUNNER_TEMP}/sccache-turbo-proxy.pid

        # Wait for proxy to be listening
        for i in 1 2 3 4 5; do
          curl -sf http://127.0.0.1:${SCCACHE_TURBO_PROXY_PORT:-18080}/ -o /dev/null --max-time 2 && break
          sleep 1
        done

        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_WEBDAV_ENDPOINT=http://127.0.0.1:${SCCACHE_TURBO_PROXY_PORT:-18080}" >> $GITHUB_ENV
        echo "SCCACHE_WEBDAV_KEY_PREFIX=sccache-v1" >> $GITHUB_ENV
        echo "SCCACHE_BASE_DIR=${{ inputs.base-dir || github.workspace }}" >> $GITHUB_ENV
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
        echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
        # Enable sccache debug logging to see cache key computation
        echo "SCCACHE_LOG=sccache=debug" >> $GITHUB_ENV
        echo "SCCACHE_ERROR_LOG=${RUNNER_TEMP}/sccache-debug.log" >> $GITHUB_ENV

    - name: Start sccache server
      if: ${{ inputs.mode == 'start' }}
      shell: bash
      run: |
        echo "SCCACHE_BASE_DIR=${SCCACHE_BASE_DIR}"
        echo "SCCACHE_WEBDAV_ENDPOINT=${SCCACHE_WEBDAV_ENDPOINT}"
        sccache --start-server 2>&1 || echo "sccache server may already be running"
        sccache --show-stats 2>&1 | head -20

    - name: Stop sccache + show stats
      if: ${{ inputs.mode == 'stop' }}
      shell: bash
      run: |
        echo "=== sccache stats ==="
        sccache --show-stats || true
        sccache --stop-server 2>/dev/null || true

        # Stop the proxy (sends SIGTERM which triggers log dump)
        if [ -f ${RUNNER_TEMP}/sccache-turbo-proxy.pid ]; then
          kill $(cat ${RUNNER_TEMP}/sccache-turbo-proxy.pid) 2>/dev/null || true
          sleep 1
          rm -f ${RUNNER_TEMP}/sccache-turbo-proxy.pid
        fi
        # Show sccache debug log — focus on cache misses to understand key differences
        if [ -f ${RUNNER_TEMP}/sccache-debug.log ]; then
          SLOG=${RUNNER_TEMP}/sccache-debug.log
          echo "=== sccache debug log: line count ==="
          wc -l "$SLOG"
          echo "=== sccache debug log: full ==="
          cat "$SLOG"
        else
          echo "=== sccache debug log: NOT FOUND ==="
        fi

        # Show proxy log
        if [ -f ${RUNNER_TEMP}/sccache-turbo-proxy.log ]; then
          LOGF=${RUNNER_TEMP}/sccache-turbo-proxy.log
          echo "=== proxy log: line count ==="
          wc -l "$LOGF"
          echo "=== proxy log: method summary ==="
          sed 's/^[^ ]* //' "$LOGF" | cut -d' ' -f1 | sort | uniq -c | sort -rn || true
          echo "=== proxy log: PUT lines (last 20) ==="
          grep ' PUT ' "$LOGF" | tail -20 || echo "(no PUTs found)"
          echo "=== proxy log: ERROR lines ==="
          grep -i 'ERROR' "$LOGF" | tail -20 || echo "(no errors)"
          echo "=== proxy log: GET results summary ==="
          grep ' GET ' "$LOGF" | sed 's/.* -> //' | sort | uniq -c | sort -rn || true
          echo "=== proxy log: last 100 ==="
          tail -100 "$LOGF"
          echo "=== proxy log: full log ==="
          cat "$LOGF"
        fi
